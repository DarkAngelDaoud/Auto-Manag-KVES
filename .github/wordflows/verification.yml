name: Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la signature
        run: node outils/verifier.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les outils de test
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lancer les tests
        working-directory: tests
        run: node run.js
